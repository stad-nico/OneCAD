@for (renderMode of modes; track renderMode) {
  @let isModeSelected = mode() === renderMode;

  <div
    (click)="mode.set(renderMode)"
    [class.bg-blue-600]="isModeSelected"
    [class.bg-gray-700]="!isModeSelected"
    [class.text-white]="isModeSelected"
    [class.scale-110]="isModeSelected"
    [class.shadow-lg]="isModeSelected"
    class="flex items-center justify-center w-12 h-12 rounded-full text-slate-400 transition-all"
  >
    @switch (renderMode) {
      @case (RenderMode.Solid) {
        <svg
          class="w-6 h-6 mx-auto"
          fill="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="12" cy="12" r="10" fill="currentColor" />
        </svg>
      }
      @case (RenderMode.Transparent) {
        <svg
          class="w-6 h-6 mx-auto"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          stroke-width="1.5"
        >
          <circle cx="12" cy="12" r="10" />
          <path
            d="M12 2 A10 10 0 0 1 22 12 A10 10 0 0 1 12 22 A10 10 0 0 1 2 12 A10 10 0 0 1 12 2"
            fill="currentColor"
            opacity="0.3"
          />
        </svg>
      }
      @case (RenderMode.Lines) {
        <svg
          class="w-6 h-6 mx-auto"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          stroke-width="1.2"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="2" y1="12" x2="22" y2="12" />
          <line x1="12" y1="2" x2="12" y2="22" />
          <path d="M5.86 5.86 Q12 2 18.14 5.86" />
          <path d="M18.14 18.14 Q12 22 5.86 18.14" />
        </svg>
      }
    }
  </div>
}
