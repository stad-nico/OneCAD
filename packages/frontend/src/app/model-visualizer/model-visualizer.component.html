<canvas #canvas></canvas>

<app-render-mode-toggle
  class="absolute bottom-8 left-1/2 -translate-x-1/2"
  (modeChange)="renderer().setRenderMode($event)"
/>

@let meshes = visualizations();

@if (meshes.length === 0) {
  <div
    class="flex flex-col absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 items-center justify-center"
  >
    <div
      class="flex items-center justify-center size-24 rounded-full bg-blue-500/20 mb-4 animate-pulse"
    >
      <svg
        class="w-12 h-12 text-blue-400"
        fill="currentColor"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 -960 960 960"
      >
        <path
          d="M460-171.46v-297.08L200-619.08v283.23q0 6.16 3.08 11.54 3.07 5.39 9.23 9.23L460-171.46Zm40 0 247.69-143.62q6.16-3.84 9.23-9.23 3.08-5.38 3.08-11.54v-283.23L500-468.54v297.08Zm-20-331.46 257-148.54-244.69-141.62q-6.16-3.84-12.31-3.84t-12.31 3.84L223-651.46l257 148.54ZM192.31-279.69q-15.16-8.69-23.73-23.62-8.58-14.92-8.58-32.31v-288.76q0-17.39 8.58-32.31 8.57-14.93 23.73-23.62l255.38-147.15q15.16-8.69 32.31-8.69 17.15 0 32.31 8.69l255.38 147.15q15.16 8.69 23.73 23.62 8.58 14.92 8.58 32.31v288.76q0 17.39-8.58 32.31-8.57 14.93-23.73 23.62L512.31-132.54q-15.16 8.69-32.31 8.69-17.15 0-32.31-8.69L192.31-279.69ZM480-480Z"
        />
      </svg>
    </div>
    <p class="text-slate-300">Select a model to view</p>
  </div>
}
