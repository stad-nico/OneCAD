<div class="flex size-full bg-slate-950">
  <!-- Model List Sidebar -->
  <app-model-list
    [models]="models()"
    [selectedModel]="getSelectedModel()"
    (modelSelected)="setSelectedModel($event)"
  ></app-model-list>

  <!-- Main Visualizer -->
  <div class="flex-1 flex flex-col">
    <app-model-visualizer
      [triangulation]="selectedNode()?.triangulation || null"
      [label]="selectedNode()?.label || null"
      [isLoading]="isLoading()"
      [error]="error()"
    ></app-model-visualizer>
  </div>
</div>
