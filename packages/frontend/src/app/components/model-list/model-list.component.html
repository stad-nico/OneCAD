<pihub-tree
  [nodes]="treeNodes()"
  (selectedIdChange)="onSelectedIdChange($event)">
  <ng-template
    treeNode
    let-node>
    <section [class.selected]="node.isSelected">
      <header [class.bg-blue-500]="node.isSelected">
        <p class="text-white">{{ node.name }}</p>
      </header>
      @if (node.children) {
        <main class="pl-4">
          <ng-container *ngTemplateOutlet="node.children" />
        </main>
      }
    </section>
  </ng-template>
</pihub-tree>
