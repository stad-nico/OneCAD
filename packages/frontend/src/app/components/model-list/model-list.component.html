<pihub-tree [nodes]="treeNodes()">
  <ng-template
    treeNode
    let-node>
    <section [class.selected]="node.isSelected">
      <header>
        <p class="text-white">{{ node.name }}</p>
      </header>
      @if (node.children) {
        <main class="pl-4">
          <ng-container *ngTemplateOutlet="node.children" />
        </main>
      }
    </section>
  </ng-template>
</pihub-tree>
